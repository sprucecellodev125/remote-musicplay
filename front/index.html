<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Server Music Player</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid py-3">
  <div class="row g-3">

    <!-- ================= LEFT: now playing + controls ================= -->
    <div class="col-lg-5 col-xl-4">
      <div class="card h-100 shadow-sm">
        <div class="card-body d-flex flex-column">

          <div class="cover-wrap mx-auto mb-3">
            <img id="cover" class="cover-img" alt="Album cover">
          </div>

          <div class="text-center mb-3">
            <h4 id="np-title" class="mb-1 text-truncate">Nothing playing</h4>
            <div id="np-artist" class="text-secondary text-truncate">—</div>
            <div id="np-album" class="small text-secondary text-truncate">—</div>
          </div>

          <div class="mb-2">
            <input type="range" id="progress" class="form-range" min="0" max="1000" value="0">
            <div class="d-flex justify-content-between small text-secondary">
              <span id="pos">0:00</span>
              <span id="dur">0:00</span>
            </div>
          </div>

          <div class="d-flex justify-content-center align-items-center gap-3 mb-3">
            <button id="prev" class="btn btn-outline-light btn-player" title="Previous">
              <i class="bi bi-skip-backward-fill"></i>
            </button>
            <button id="toggle" class="btn btn-light btn-play" title="Play / Pause">
              <i id="icon-play" class="bi bi-play-fill"></i>
              <i id="icon-pause" class="bi bi-pause-fill d-none"></i>
            </button>
            <button id="stop" class="btn btn-outline-light btn-player" title="Stop">
              <i class="bi bi-stop-fill"></i>
            </button>
            <button id="next" class="btn btn-outline-light btn-player" title="Next">
              <i class="bi bi-skip-forward-fill"></i>
            </button>
          </div>

          <div class="d-flex align-items-center gap-2">
            <i class="bi bi-volume-down text-secondary"></i>
            <input type="range" id="volume" class="form-range" min="0" max="100" value="80">
            <span id="vol-label" class="small text-secondary" style="width:2.2rem">80</span>
          </div>

          <div class="mt-auto pt-3 small text-secondary text-center">
            <i class="bi bi-speaker-fill"></i>
            Audio is played by the server's Hi-Fi output.
          </div>
        </div>
      </div>
    </div>

    <!-- ================= RIGHT: library ================= -->
    <div class="col-lg-7 col-xl-8">
      <div class="card h-100 shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center gap-2 flex-wrap">
          <span class="fw-semibold">
            <i class="bi bi-music-note-list"></i> Library
            <span id="count" class="badge text-bg-secondary">0</span>
          </span>
          <div class="d-flex gap-2">
            <input id="search" class="form-control form-control-sm" placeholder="Search…" style="width:190px">
            <button id="rescan" class="btn btn-sm btn-outline-light" title="Rescan music folder">
              <i class="bi bi-arrow-clockwise"></i>
            </button>
          </div>
        </div>
        <div class="list-group list-group-flush track-list" id="track-list"></div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
